<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #18181b;
      color: #f4f4f5;
    }
    
    .container {
      padding: 18px;
    }
    
    h1 {
      font-size: 15px;
      margin-bottom: 16px;
      color: #fafafa;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .form-group {
      margin-bottom: 14px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 12px;
      color: #a1a1aa;
    }
    
    .form-group select,
    .form-group input[type="text"],
    .form-group input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      font-size: 13px;
      background: #27272a;
      color: #fafafa;
      transition: border-color 0.2s;
    }

    .form-group select:focus,
    .form-group input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    #customModelInput {
      margin-top: 6px;
      display: none;
    }
    
    .checkbox-group {
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .checkbox-group input[type="checkbox"] {
      cursor: pointer;
      accent-color: #6366f1;
    }
    
    .checkbox-group label {
      font-weight: 500;
      font-size: 12px;
      color: #d4d4d8;
      cursor: pointer;
      user-select: none;
    }
    
    button {
      width: 100%;
      padding: 10px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: background 0.2s;
    }
    
    button:hover {
      background: #4f46e5;
    }
    
    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
      display: none;
      font-weight: 500;
    }
    
    .status.success {
      background-color: #064e3b;
      color: #6ee7b7;
      display: block;
    }
    
    .status.error {
      background-color: #7f1d1d;
      color: #fca5a5;
      display: block;
    }
    
    .info {
      background-color: #27272a;
      border-left: 3px solid #6366f1;
      padding: 10px;
      font-size: 11px;
      margin-top: 14px;
      border-radius: 4px;
      color: #a1a1aa;
      line-height: 1.4;
    }
    
    .info a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 500;
    }
    
    .info a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌙 Auto Dark Theme</h1>

    <div class="form-group">
      <label for="providerSelect">Rendering Engine :</label>
      <select id="providerSelect">
        <option value="openai">OpenAI Engine</option>
        <option value="anthropic">Anthropic Engine</option>
        <option value="gemini">Google Gemini Engine</option>
        <option value="deepseek">DeepSeek Engine</option>
      </select>
    </div>

    <div class="form-group">
      <label for="modelSelect">Processing Model :</label>
      <select id="modelSelect"></select>
      <input type="text" id="customModelInput" placeholder="Custom model identifier...">
    </div>
    
    <div class="form-group">
      <label for="apiKeyInput" id="apiKeyLabel">Engine Token :</label>
      <input type="password" id="apiKeyInput" placeholder="sk-...">
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="enableExtension" checked>
      <label for="enableExtension">Enable adaptive element inspection</label>
    </div>
    
    <button id="saveBtn">Save Preferences</button>
    
    <div id="status" class="status"></div>

    <div class="info" id="providerInfo">
      Engine Token Portal: <a id="keyLink" href="#" target="_blank">Lien</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
